[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuseye"
version = "0.1.0"
description = "Training-light fisheye detection with YOLO26-x, GridViews, Z-Adapters and AgreeFusion"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}

[tool.setuptools.packages.find]
include = ["fuseye*"]
